<style>
:root{
  --bg:#050607; --panel:#0e1113; --panel2:#14181b; --line:#23282c;
  --blue:#4db8f0; --blue-dim:#1c3f52; --white:#f4f6f7; --dim:#9aa4aa;
  --green:#3fbf7f; --red:#e0553f; --orange:#f0a94d; --yellow:#f5d90a;
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
#sp-root{
  background:var(--bg); color:var(--white); font-family:var(--sans);
  min-height:100vh; width:100%; display:flex; flex-direction:column; align-items:stretch;
  position:relative; overflow-x:hidden;
}
#sp-root:before{
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.5;
  background-image:radial-gradient(1px 1px at 20% 30%, #ffffff55 1px, transparent 1px),
                    radial-gradient(1px 1px at 70% 60%, #ffffff33 1px, transparent 1px),
                    radial-gradient(1.5px 1.5px at 40% 80%, #ffffff44 1px, transparent 1px),
                    radial-gradient(1px 1px at 85% 15%, #ffffff33 1px, transparent 1px),
                    radial-gradient(1px 1px at 55% 45%, #ffffff22 1px, transparent 1px);
  background-size:100% 100%;
  z-index:0;
}
.sp-wrap{ position:relative; z-index:1; max-width:900px; margin:0 auto; width:100%; padding:24px 20px 64px; }
.sp-wrap.has-timer{ padding-top:64px; }
.sp-logo{ display:flex; align-items:center; gap:10px; justify-content:center; margin:28px 0 6px; }
.sp-logo svg{ width:26px; height:26px; }
.sp-logo span{ font-family:var(--mono); letter-spacing:.28em; font-size:15px; color:var(--white); font-weight:600; }
.sp-title{ text-align:center; font-size:clamp(28px,5vw,44px); font-weight:800; margin:6px 0 4px; letter-spacing:-0.02em; }
.sp-title .accent{ color:var(--blue); }
.sp-sub{ text-align:center; color:var(--dim); font-size:15px; margin-bottom:36px; line-height:1.5; }
.sp-card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:28px; margin-bottom:18px; }
.sp-btn-row{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:8px; }
.sp-btn{
  appearance:none; border:1px solid var(--line); background:var(--panel2); color:var(--white);
  font-family:var(--sans); font-size:16px; font-weight:600; padding:16px 26px; border-radius:10px;
  cursor:pointer; transition:all .15s ease; display:flex; align-items:center; gap:10px; justify-content:center;
}
.sp-btn:hover{ border-color:var(--blue); background:#111a20; transform:translateY(-1px); }
.sp-btn.primary{ background:var(--blue); color:#04141c; border-color:var(--blue); }
.sp-btn.primary:hover{ background:#66c6f4; }
.sp-btn.wide{ width:100%; }
.sp-btn.big{ font-size:20px; padding:22px 34px; }
.sp-btn:disabled{ opacity:.4; cursor:not-allowed; transform:none; }
.sp-btn.yellow{ background:var(--yellow); color:#241d00; border-color:var(--yellow); }
.sp-btn.yellow:hover{ background:#ffe75c; }
.sp-team-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.sp-team-btn{
  appearance:none; border:2px solid var(--line); background:var(--panel2); color:var(--white);
  font-family:var(--sans); font-size:22px; font-weight:800; padding:32px 10px; border-radius:12px;
  cursor:pointer; transition:all .15s ease;
}
.sp-team-btn:hover{ border-color:var(--blue); background:#111a20; transform:translateY(-2px); }
.sp-team-btn.selected{ border-color:var(--blue); background:var(--blue-dim); color:var(--blue); box-shadow:inset 0 0 0 1px var(--blue); }
.sp-input{
  width:100%; background:#0a0d0f; border:1px solid var(--line); color:var(--white);
  font-family:var(--sans); font-size:16px; padding:14px 16px; border-radius:8px; outline:none;
}
.sp-input:focus{ border-color:var(--blue); }
.sp-field{ margin-bottom:16px; }
.sp-field label{ display:block; font-family:var(--mono); font-size:11px; letter-spacing:.12em; color:var(--dim); margin-bottom:8px; text-transform:uppercase; }
.sp-chip{
  display:inline-block; font-family:var(--mono); font-size:11px; letter-spacing:.14em; font-weight:700;
  padding:5px 11px; border-radius:100px; border:1px solid currentColor; text-transform:uppercase; margin-bottom:16px;
}
.sp-progress-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:16px; }
.sp-progress-track{ flex:1; height:6px; background:var(--line); border-radius:100px; overflow:hidden; }
.sp-progress-fill{ height:100%; background:var(--blue); transition:width .3s ease; }
.sp-score-badge{ font-family:var(--mono); font-size:13px; color:var(--dim); white-space:nowrap; }
.sp-question-img{ width:100%; border-radius:10px; display:block; margin-bottom:18px; border:1px solid var(--line); }
.sp-prompt{ font-size:19px; font-weight:600; margin-bottom:18px; line-height:1.4; }
.sp-hint{ font-family:var(--mono); font-size:13px; color:var(--orange); background:#2a220c; border:1px solid #5c4c1c; border-radius:8px; padding:10px 14px; margin:-8px 0 18px; }
.sp-quote{ font-size:19px; line-height:2.1; font-style:italic; color:#e8ebec; margin-bottom:8px; }
.sp-blank-input{
  display:inline-block; background:var(--blue); border:none; border-bottom:2px solid var(--blue);
  color:#04141c; font-style:normal; font-weight:700; font-family:var(--sans); font-size:17px;
  padding:6px 10px; border-radius:5px; text-align:center; vertical-align:middle; outline:none;
  margin:3px 5px; min-width:2.6em;
}
.sp-blank-input::placeholder{ color:#04141c99; }
.sp-blank-input.graded-correct{ background:var(--green); color:#04170d; }
.sp-blank-input.graded-wrong{ background:var(--red); color:#210603; text-decoration:line-through; }
.sp-reveal{ font-family:var(--mono); font-size:13px; color:var(--green); margin-top:4px; }
.sp-reveal.wrong{ color:var(--red); }
.sp-blank-block{ margin-bottom:14px; }
.sp-blank-block label{ display:block; font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--dim); margin-bottom:6px; text-transform:uppercase; }
.sp-feedback-banner{ border-radius:10px; padding:14px 16px; margin:18px 0; font-weight:700; font-size:15px; display:flex; align-items:center; gap:10px; }
.sp-feedback-banner.all-correct{ background:#0c2a1c; color:var(--green); border:1px solid #1c5c3c; }
.sp-feedback-banner.partial{ background:#2a220c; color:var(--orange); border:1px solid #5c4c1c; }
.sp-feedback-banner.all-wrong{ background:#2a0f0c; color:var(--red); border:1px solid #5c261c; }
.sp-summary-score{ text-align:center; font-size:56px; font-weight:800; color:var(--blue); margin:10px 0 2px; }
.sp-summary-total{ text-align:center; color:var(--dim); font-family:var(--mono); margin-bottom:8px; }
.sp-summary-time{ text-align:center; color:var(--white); font-family:var(--mono); font-size:15px; margin-bottom:18px; }
.sp-summary-time b{ color:var(--blue); }
.sp-review-row{ display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); align-items:flex-start; }
.sp-review-row:last-child{ border-bottom:none; }
.sp-review-icon{ font-size:16px; flex-shrink:0; width:20px; text-align:center; }
.sp-review-body{ flex:1; font-size:14px; line-height:1.5; color:var(--dim); }
.sp-review-body b{ color:var(--white); }
.sp-topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.sp-back{ background:none; border:none; color:var(--dim); font-family:var(--mono); font-size:12px; cursor:pointer; letter-spacing:.08em; }
.sp-back:hover{ color:var(--white); }
.sp-lit{ display:inline-block; padding:0 4px; font-style:italic; color:#c7ccce; }
.sp-submit-bar{ position:sticky; bottom:14px; text-align:center; border-color:var(--yellow); box-shadow:0 8px 30px #000000cc; }
.sp-qgroup{ scroll-margin-top:70px; }
.sp-mc-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.sp-mc-option{
  appearance:none; text-align:left; border:1px solid var(--line); background:#0a0d0f; color:var(--white);
  font-family:var(--sans); font-size:15px; font-weight:600; padding:14px 16px; border-radius:8px;
  cursor:pointer; transition:all .12s ease;
}
.sp-mc-option:hover{ border-color:var(--blue); }
.sp-mc-option.selected{ border-color:var(--blue); background:var(--blue-dim); box-shadow:inset 0 0 0 1px var(--blue); }
.sp-mc-option.reveal-correct{ border-color:var(--green); background:#0c2a1c; color:var(--green); font-weight:800; }
.sp-mc-option.reveal-wrong-pick{ border-color:var(--red); background:#2a0f0c; color:var(--red); text-decoration:line-through; }
.sp-mc-option:disabled{ cursor:default; }
.sp-bank-wrap{ display:flex; flex-wrap:wrap; gap:9px; margin-top:6px; }
.sp-bank-chip{
  appearance:none; border:1px solid var(--line); background:#0a0d0f; color:var(--white);
  font-family:var(--sans); font-size:14px; font-weight:600; padding:10px 16px; border-radius:100px;
  cursor:pointer; transition:all .12s ease;
}
.sp-bank-chip:hover{ border-color:var(--blue); }
.sp-bank-chip.selected{ border-color:var(--blue); background:var(--blue-dim); }
.sp-bank-chip.bank-correct-selected{ border-color:var(--green); background:#0c2a1c; color:var(--green); font-weight:800; }
.sp-bank-chip.bank-correct-missed{ border-color:var(--orange); color:var(--orange); background:#2a220c; }
.sp-bank-chip.bank-wrong-selected{ border-color:var(--red); background:#2a0f0c; color:var(--red); text-decoration:line-through; }
.sp-bank-chip:disabled{ cursor:default; }
.sp-timer-bar{
  position:fixed; top:0; left:0; right:0; z-index:100; background:#0a0d0fee; backdrop-filter:blur(4px);
  border-bottom:1px solid var(--line); padding:10px 16px; display:flex; align-items:center; justify-content:center;
  gap:10px; font-family:var(--mono); font-size:15px; letter-spacing:.06em; color:var(--white);
}
.sp-timer-bar .tval{ color:var(--blue); font-weight:800; font-size:17px; }
.sp-timer-bar .tteam{ color:var(--dim); }
.sp-shot-banner{
  background:linear-gradient(135deg,#123044,#0a1a26); border:2px dashed var(--blue); border-radius:12px;
  padding:16px 18px; text-align:center; font-weight:800; font-size:17px; color:var(--blue); margin-bottom:18px;
}
.sp-results-card{ background:var(--panel); border:2px solid var(--blue); border-radius:16px; padding:26px; margin-bottom:18px; }
@media (max-width:560px){
  .sp-quote{ font-size:17px; }
  .sp-summary-score{ font-size:44px; }
  .sp-mc-grid{ grid-template-columns:1fr; }
  .sp-team-btn{ padding:24px 10px; font-size:19px; }
}
</style>

<script>
(function(){
  const DATA = JSON.parse(document.getElementById('sp-data').textContent);
  const IMAGES = JSON.parse(document.getElementById('sp-images').textContent);
  const QUESTIONS = DATA.questions;
  const MAX_SCORE = DATA.maxScore;
  const CAT_COLORS = {"WEBSITE": "#4db8f0", "TECHCRUNCH": "#9aa0a6", "PITCH DECK": "#4db8f0", "PAYLOAD": "#f0a94d", "NASA BREAK THE ICE": "#e0553f", "BONUS": "#3fbf7f"};
  const LOGO = "<svg viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M12 1 L12 23 M3 6 L21 18 M21 6 L3 18\" stroke=\"#4db8f0\" stroke-width=\"1.4\"/>\n<circle cx=\"12\" cy=\"12\" r=\"2.2\" fill=\"#4db8f0\"/>\n</svg>";
  const TEAMS = ['TEAM SSS','TEAM XSS','TEAM MNR','TEAM JKL'];

  let state = { screen: 'landing' };

  // ---------------- timer ----------------
  let timerHandle = null;
  let timerStartMs = null;
  let elapsedFrozenSec = null;

  function formatTime(sec){
    const m = Math.floor(sec/60), s = sec%60;
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }
  function tickTimer(){
    const el = document.getElementById('sp-timer-value');
    if(!el || timerStartMs == null) return;
    const sec = Math.floor((Date.now()-timerStartMs)/1000);
    el.textContent = formatTime(sec);
  }
  function startTimer(teamName){
    timerStartMs = Date.now();
    elapsedFrozenSec = null;
    const bar = document.getElementById('sp-timer-bar');
    const teamEl = document.getElementById('sp-timer-team');
    if(bar) bar.style.display = 'flex';
    if(teamEl) teamEl.textContent = teamName ? ('\u2014 ' + teamName) : '';
    if(timerHandle) clearInterval(timerHandle);
    timerHandle = setInterval(tickTimer, 500);
    tickTimer();
  }
  function stopTimer(){
    if(timerStartMs != null){
      elapsedFrozenSec = Math.floor((Date.now()-timerStartMs)/1000);
    }
    if(timerHandle) clearInterval(timerHandle);
    timerHandle = null;
    const el = document.getElementById('sp-timer-value');
    if(el && elapsedFrozenSec != null) el.textContent = formatTime(elapsedFrozenSec);
  }
  function hideTimer(){
    if(timerHandle) clearInterval(timerHandle);
    timerHandle = null;
    timerStartMs = null;
    elapsedFrozenSec = null;
    const bar = document.getElementById('sp-timer-bar');
    if(bar) bar.style.display = 'none';
  }

  // ---------------- grading helpers ----------------
  function normalize(s){
    return String(s||'').toLowerCase().trim()
      .replace(/[\$"']/g,'')
      .replace(/[.,!?]/g,'')
      .replace(/\s+/g,' ')
      .trim();
  }
  function digits(s){
    let m = String(s||'').match(/-?\d+(\.\d+)?/);
    return m ? m[0] : '';
  }
  function levenshtein(a,b){
    const m=a.length, n=b.length;
    if(!m) return n; if(!n) return m;
    let prev = Array(n+1).fill(0).map((_,i)=>i);
    for(let i=1;i<=m;i++){
      let cur=[i];
      for(let j=1;j<=n;j++){
        cur[j] = a[i-1]===b[j-1] ? prev[j-1] : 1+Math.min(prev[j-1],prev[j],cur[j-1]);
      }
      prev=cur;
    }
    return prev[n];
  }
  function isCorrect(input, blank){
    const norm = normalize(input);
    if(!norm) return false;
    const normNoSpace = norm.replace(/\s+/g,'');
    for(const accepted of blank.accept){
      const a = normalize(accepted);
      if(norm === a) return true;
      if(normNoSpace === a.replace(/\s+/g,'')) return true;
      if(a.length >= 4){
        const thresh = a.length >= 8 ? 2 : 1;
        if(levenshtein(normNoSpace, a.replace(/\s+/g,'')) <= thresh) return true;
      }
    }
    if(blank.numeric){
      const di = digits(input);
      for(const accepted of blank.accept){
        const da = digits(accepted);
        if(!da) continue;
        if(di === da) return true;
        if(di === da.replace('-','')) return true;
        if('-'+di === da) return true;
      }
    }
    return false;
  }

  // ---------------- render dispatch ----------------
  function render(){
    const app = document.getElementById('sp-app');
    app.innerHTML = renderScreen();
    app.classList.toggle('has-timer', document.getElementById('sp-timer-bar').style.display !== 'none');
    wireEvents();
    window.scrollTo(0,0);
  }

  function renderScreen(){
    if(state.screen === 'landing') return screenLanding();
    if(state.screen === 'play') return screenPlayAll();
    if(state.screen === 'reveal') return screenReveal();
    if(state.screen === 'summary') return screenSummary();
    return screenLanding();
  }

  function screenLanding(){
    const buttons = TEAMS.map((t, i) => `<button type="button" class="sp-team-btn${i===0?' selected':''}" data-action="select-team-inline" data-team="${escapeAttr(t)}">${escapeHtml(t)}</button>`).join('');
    return `
      <div class="sp-logo">${LOGO}<span>STARPATH</span></div>
      <div class="sp-card" style="margin-top:24px;">
        <div class="sp-field" style="margin-bottom:0;">
          <label>Select Your Team</label>
          <div class="sp-team-grid">${buttons}</div>
        </div>
        <button class="sp-btn primary big wide" data-action="start-game" style="margin-top:64px;">START</button>
      </div>
    `;
  }

  // ---------------- shared blank-input rendering ----------------
  function blankInputHTML(blank, qi, bi, mode, st){
    const reveal = mode === 'reveal';
    const disabled = reveal ? 'disabled' : '';
    const clsExtra = reveal ? (st.correct ? ' graded-correct' : ' graded-wrong') : '';
    if(blank.tokens){
      // All box tokens within one blank share the same width — sized to the
      // longest box among them — so multi-word answers look even, not staggered.
      const boxLens = blank.tokens.filter(t => !t.lit).map(t => String(t.box||'').length);
      const maxLen = Math.max(4, ...boxLens);
      const w = Math.max(8, (maxLen + 3) * 2);
      let ti = 0;
      let out = '';
      blank.tokens.forEach(tok => {
        if(tok.lit){
          out += `<span class="sp-lit">${escapeHtml(tok.lit)}</span>`;
        } else {
          const val = reveal ? ((st.rawValues && st.rawValues[ti]) || '') : '';
          out += `<input type="text" id="inp-${qi}-${bi}-${ti}" data-qi="${qi}" class="sp-blank-input${clsExtra}" style="width:${w}ch" placeholder="?" value="${escapeAttr(val)}" ${disabled} autocomplete="off"/>`;
          ti++;
        }
      });
      return out;
    }
    const w = Math.max(8, ((blank.w || 6) + 2) * 2);
    const val = reveal ? ((st.rawValues && st.rawValues[0]) || '') : '';
    return `<input type="text" id="inp-${qi}-${bi}-0" data-qi="${qi}" class="sp-blank-input${clsExtra}" style="width:${w}ch" placeholder="?" value="${escapeAttr(val)}" ${disabled} autocomplete="off"/>`;
  }

  function renderReveal(st, blank){
    if(st.correct) return '';
    return `<div class="sp-reveal wrong">Correct answer: ${escapeHtml(blank.accept[0])}</div>`;
  }

  function renderMC(q, qi, mode, result){
    const selected = mode === 'reveal' ? (result.blankState[0].value || '') : null;
    const options = q.options.map((opt, oi) => {
      let cls = 'sp-mc-option';
      let disabled = '';
      if(mode === 'reveal'){
        disabled = 'disabled';
        if(opt === q.correct) cls += ' reveal-correct';
        else if(opt === selected) cls += ' reveal-wrong-pick';
      }
      return `<button type="button" class="${cls}" data-qi="${qi}" data-mc-value="${escapeAttr(opt)}" ${disabled}>${escapeHtml(opt)}</button>`;
    }).join('');
    return `<div class="sp-mc-grid" data-mcgroup="${qi}">${options}</div>`;
  }

  function renderWordbank(q, qi, mode, result){
    let selectedSet = null;
    if(mode === 'reveal'){
      selectedSet = new Set();
      result.blankState.forEach(s => { if(s.correct) selectedSet.add(s.value); });
      // also need the wrong picks the team made — stashed on result.extraPicks
      (result.extraPicks || []).forEach(v => selectedSet.add(v));
    }
    const chips = q.bank.map(word => {
      let cls = 'sp-bank-chip';
      let disabled = '';
      if(mode === 'reveal'){
        disabled = 'disabled';
        const isCorrectWord = q.correctSet.includes(word);
        const wasPicked = (result.pickedSet || []).includes(word);
        if(isCorrectWord && wasPicked) cls += ' bank-correct-selected';
        else if(isCorrectWord && !wasPicked) cls += ' bank-correct-missed';
        else if(!isCorrectWord && wasPicked) cls += ' bank-wrong-selected';
      }
      return `<button type="button" class="${cls}" data-qi="${qi}" data-bank-value="${escapeAttr(word)}" ${disabled}>${escapeHtml(word)}</button>`;
    }).join('');
    return `<div class="sp-bank-wrap" data-bankgroup="${qi}">${chips}</div>`;
  }

  // Renders one question's chip + card. mode 'edit' = play screen (ungraded, live inputs).
  // mode 'reveal' = reveal screen (graded, read-only, colored, with a feedback banner).
  function renderQuestionCard(q, qi, mode, result){
    const color = CAT_COLORS[q.cat] || '#4db8f0';
    let body = '';

    if(q.mc){
      if(q.img) body += `<img class="sp-question-img" src="data:image/jpeg;base64,${IMAGES[q.img]}" alt="redacted slide"/>`;
      body += `<div class="sp-prompt">${escapeHtml(q.prompt)}</div>`;
      body += renderMC(q, qi, mode, result);
    } else if(q.wordbank){
      if(q.img) body += `<img class="sp-question-img" src="data:image/jpeg;base64,${IMAGES[q.img]}" alt="redacted slide"/>`;
      body += `<div class="sp-prompt">${escapeHtml(q.prompt)}</div>`;
      body += renderWordbank(q, qi, mode, result);
    } else if(q.type === 'image'){
      if(q.img) body += `<img class="sp-question-img" src="data:image/jpeg;base64,${IMAGES[q.img]}" alt="redacted slide"/>`;
      body += `<div class="sp-prompt">${escapeHtml(q.prompt)}</div>`;
      if(q.hint) body += `<div class="sp-hint">💡 ${escapeHtml(q.hint)}</div>`;
      q.blanks.forEach((b, bi) => {
        // an "extra" image + prompt can be interleaved before one of the blanks
        // (e.g. a second picture that asks a related, separately-graded question)
        if(q.extraImg && q.extraAt === bi){
          body += `<img class="sp-question-img" style="margin-top:18px;" src="data:image/jpeg;base64,${IMAGES[q.extraImg]}" alt="redacted slide"/>`;
          body += `<div class="sp-prompt">${escapeHtml(q.extraPrompt)}</div>`;
        }
        const st = mode === 'reveal' ? result.blankState[bi] : null;
        body += `<div class="sp-blank-block">
          <label>${escapeHtml(b.label || ('Blank ' + (bi+1)))}</label>
          ${blankInputHTML(b, qi, bi, mode, st)}
          ${(mode==='reveal' && !st.correct) ? renderReveal(st, b) : ''}
        </div>`;
      });
    } else {
      // text type: inline blanks inside template. Every blank occurrence, in order,
      // is marked with the literal token %%BLANK%% in the template.
      let parts = q.template.split('%%BLANK%%');
      let html = '';
      if(q.repeat_single){
        const st = mode === 'reveal' ? result.blankState[0] : null;
        const echoCls = mode === 'reveal' ? (st.correct ? ' graded-correct' : ' graded-wrong') : '';
        const echoW = Math.max(8, ((q.blanks[0].w || 8) + 2) * 2);
        html = escapeHtml(parts[0]);
        for(let i=1;i<parts.length;i++){
          const echoVal = mode === 'reveal' ? ((st.rawValues && st.rawValues[0]) || '') : '';
          html += `<input type="text" class="sp-blank-input${echoCls}" style="width:${echoW}ch" placeholder="?" value="${escapeAttr(echoVal)}" disabled tabindex="-1"/>`;
          html += escapeHtml(parts[i]);
        }
        body += `<div class="sp-quote">${html}</div>`;
        body += `<div class="sp-blank-block" style="margin-top:16px;">
          <label>${escapeHtml(q.blanks[0].label || 'Your answer')}</label>
          ${blankInputHTML(q.blanks[0], qi, 0, mode, st)}
          ${(mode==='reveal' && !st.correct) ? renderReveal(st, q.blanks[0]) : ''}
        </div>`;
      } else {
        html = escapeHtml(parts[0]);
        for(let i=1;i<parts.length;i++){
          const bi = i-1;
          const st = mode === 'reveal' ? result.blankState[bi] : null;
          html += blankInputHTML(q.blanks[bi], qi, bi, mode, st);
          html += escapeHtml(parts[i]);
        }
        body += `<div class="sp-quote">${html}</div>`;
        if(mode === 'reveal'){
          q.blanks.forEach((b,bi) => {
            const st = result.blankState[bi];
            if(!st.correct) body += renderReveal(st, b);
          });
        }
      }
    }

    let feedback = '';
    if(mode === 'reveal'){
      const correctCount = result.blankState.filter(s=>s.correct).length;
      const totalBlanks = result.blankState.length;
      let cls = 'all-wrong', msg = 'Not quite — see the answer above.';
      if(correctCount === totalBlanks){ cls='all-correct'; msg = 'Correct! +' + result.gained + ' pts'; }
      else if(correctCount > 0){ cls='partial'; msg = `Partial credit — ${correctCount}/${totalBlanks} correct (+${result.gained} pts)`; }
      feedback = `<div class="sp-feedback-banner ${cls}">${msg}</div>`;
    }

    return `
      <div class="sp-chip" style="color:${color}">${escapeHtml(q.cat)}</div>
      <div class="sp-card">
        ${body}
        ${feedback}
      </div>
    `;
  }

  function screenPlayAll(){
    const total = QUESTIONS.length;
    let cards = '';
    QUESTIONS.forEach((q, qi) => {
      cards += `<div class="sp-qgroup" data-qgroup="${qi}">${renderQuestionCard(q, qi, 'edit', null)}</div>`;
    });
    return `
      <div class="sp-topbar">
        <button class="sp-back" data-action="quit-play">← QUIT</button>
        <span class="sp-score-badge" id="answered-badge">0 / ${total} answered</span>
      </div>
      ${cards}
      <div class="sp-card sp-submit-bar">
        <button class="sp-btn yellow wide" data-action="submit-all">Submit Final Answers</button>
      </div>
    `;
  }

  function screenReveal(){
    const total = QUESTIONS.length;
    const qi = state.revealIndex;
    const q = QUESTIONS[qi];
    const result = state.results[qi];
    const scoreSoFar = state.results.slice(0, qi+1).reduce((s,r)=>s+r.gained,0);
    const pct = Math.round(((qi+1)/total)*100);
    const isLast = qi === total - 1;
    return `
      <div class="sp-topbar">
        <span class="sp-chip" style="color:#4db8f0; margin-bottom:0;">REVEAL</span>
        <span class="sp-score-badge">SCORE SO FAR: ${scoreSoFar} / ${MAX_SCORE}</span>
      </div>
      <div class="sp-progress-row">
        <div class="sp-progress-track"><div class="sp-progress-fill" style="width:${pct}%"></div></div>
        <span class="sp-score-badge">Q${qi+1}/${total}</span>
      </div>
      ${renderQuestionCard(q, qi, 'reveal', result)}
      <div class="sp-btn-row">
        <button class="sp-btn primary wide" data-action="reveal-next">${isLast ? 'See Final Results →' : 'Next Reveal →'}</button>
      </div>
    `;
  }

  function screenSummary(){
    let rows = '';
    QUESTIONS.forEach((q, qi) => {
      const r = state.results[qi];
      const bs = r.blankState;
      const correctCount = bs.filter(s=>s.correct).length;
      const icon = correctCount === bs.length ? '✅' : (correctCount>0 ? '⚠️' : '❌');
      const answerText = bs.map(s=>s.value || '(blank)').join(', ');
      const correctText = q.mc ? q.correct : (q.wordbank ? q.correctSet.join(', ') : q.blanks.map(b=>b.accept[0]).join(', '));
      rows += `<div class="sp-review-row">
        <div class="sp-review-icon">${icon}</div>
        <div class="sp-review-body">
          <b>${escapeHtml(q.cat)}</b> — you said: "${escapeHtml(answerText)}"${correctCount<bs.length ? ' · answer: "'+escapeHtml(correctText)+'"' : ''}
        </div>
      </div>`;
    });
    const timeStr = formatTime(elapsedFrozenSec != null ? elapsedFrozenSec : 0);
    return `
      <div class="sp-shot-banner">📸 SCREENSHOT THIS SCREEN and show it to your host!</div>
      <div class="sp-results-card" style="text-align:center;">
        <div class="sp-chip" style="color:#4db8f0;">MISSION COMPLETE — ${escapeHtml(state.teamName)}</div>
        <div class="sp-summary-score">${state.totalScore}</div>
        <div class="sp-summary-total">out of ${MAX_SCORE} points</div>
        <div class="sp-summary-time">Time elapsed: <b>${timeStr}</b></div>
        <div class="sp-btn-row" style="margin-top:8px;">
          <button class="sp-btn primary" data-action="go-landing">Play Again</button>
        </div>
      </div>
      <div class="sp-card">
        <div class="sp-chip" style="color:#9aa4aa;">ANSWER REVIEW</div>
        ${rows}
      </div>
    `;
  }

  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  }
  function escapeAttr(s){ return escapeHtml(s); }

  // ---------------- play -> grading ----------------
  function startPlay(teamName){
    state.teamName = teamName;
    state.screen = 'play';
    startTimer(teamName);
  }

  function collectBlankValue(q, qi, bi){
    const blank = q.repeat_single ? q.blanks[0] : q.blanks[bi];
    if(blank.tokens){
      let ti = 0, raw = [];
      blank.tokens.forEach(tok => {
        if(!tok.lit){
          const el = document.getElementById(`inp-${qi}-${bi}-${ti}`);
          raw.push(el ? el.value : '');
          ti++;
        }
      });
      const value = raw.filter(v => v && v.trim()).join(' ');
      return { value, rawValues: raw };
    }
    const el = document.getElementById(`inp-${qi}-${bi}-0`);
    const v = el ? el.value : '';
    return { value: v, rawValues: [v] };
  }

  function getSelectedMC(qi){
    const el = document.querySelector(`.sp-mc-option.selected[data-qi="${qi}"]`);
    return el ? el.dataset.mcValue : null;
  }
  function getSelectedBank(qi){
    const els = document.querySelectorAll(`.sp-bank-chip.selected[data-qi="${qi}"]`);
    return Array.from(els).map(el => el.dataset.bankValue);
  }

  function gradeQuestion(q, qi){
    if(q.mc){
      const selected = getSelectedMC(qi);
      const correct = selected != null && selected === q.correct;
      return { blankState: [{ value: selected || '(no answer)', rawValues:[selected||''], graded:true, correct }], gained: correct ? (q.maxPoints||1) : 0 };
    }
    if(q.wordbank){
      const picked = getSelectedBank(qi);
      const pickedSet = new Set(picked);
      let gained = 0;
      const blankState = q.correctSet.map(word => {
        const correct = pickedSet.has(word);
        if(correct) gained += 1;
        return { value: correct ? word : '', rawValues:[correct?word:''], graded:true, correct };
      });
      const extraPicks = picked.filter(w => !q.correctSet.includes(w));
      return { blankState, gained, pickedSet: picked, extraPicks };
    }
    if(q.repeat_single){
      const c = collectBlankValue(q, qi, 0);
      const correct = isCorrect(c.value, q.blanks[0]);
      const gained = correct ? (q.blanks[0].points || 1) : 0;
      return { blankState: [{ value:c.value, rawValues:c.rawValues, graded:true, correct }], gained };
    }
    if(q.unordered){
      const collected = q.blanks.map((b, bi) => collectBlankValue(q, qi, bi));
      const used = new Set();
      const matched = collected.map(() => false);
      collected.forEach((c, vi) => {
        for(let bj=0; bj<q.blanks.length; bj++){
          if(used.has(bj)) continue;
          if(isCorrect(c.value, q.blanks[bj])){ used.add(bj); matched[vi] = true; break; }
        }
      });
      let gained = 0;
      const blankState = collected.map((c, bi) => {
        const correct = matched[bi];
        if(correct) gained += (q.blanks[bi].points || 1);
        return { value:c.value, rawValues:c.rawValues, graded:true, correct };
      });
      return { blankState, gained };
    }
    let gained = 0;
    const blankState = q.blanks.map((b, bi) => {
      const c = collectBlankValue(q, qi, bi);
      const correct = isCorrect(c.value, b);
      if(correct) gained += (b.points || 1);
      return { value:c.value, rawValues:c.rawValues, graded:true, correct };
    });
    return { blankState, gained };
  }

  function isQuestionAnswered(q, qi){
    if(q.mc) return getSelectedMC(qi) != null;
    if(q.wordbank) return getSelectedBank(qi).length > 0;
    const inputs = document.querySelectorAll(`[data-qi="${qi}"]`);
    let any = false;
    inputs.forEach(inp => { if(inp.value && inp.value.trim()) any = true; });
    return any;
  }

  function countUnanswered(){
    let unanswered = 0;
    QUESTIONS.forEach((q, qi) => { if(!isQuestionAnswered(q, qi)) unanswered++; });
    return unanswered;
  }

  function submitAll(){
    const unanswered = countUnanswered();
    if(unanswered > 0){
      const ok = confirm(`You have ${unanswered} unanswered question(s). Submit anyway?`);
      if(!ok) return;
    }
    stopTimer();
    const results = QUESTIONS.map((q, qi) => gradeQuestion(q, qi));
    const totalScore = results.reduce((s,r) => s + r.gained, 0);
    state.screen = 'reveal';
    state.results = results;
    state.totalScore = totalScore;
    state.revealIndex = 0;
    render();
  }

  function updateAnsweredBadge(){
    const badge = document.getElementById('answered-badge');
    if(!badge) return;
    let answered = 0;
    QUESTIONS.forEach((q, qi) => { if(isQuestionAnswered(q, qi)) answered++; });
    badge.textContent = answered + ' / ' + QUESTIONS.length + ' answered';
  }

  function wireEvents(){
    document.querySelectorAll('[data-action]').forEach(el => {
      el.addEventListener('click', onAction);
    });
    if(state.screen === 'play'){
      document.querySelectorAll('input[data-qi]').forEach(el => {
        el.addEventListener('input', updateAnsweredBadge);
      });
      document.querySelectorAll('.sp-mc-option').forEach(el => {
        el.addEventListener('click', () => {
          const qi = el.dataset.qi;
          document.querySelectorAll(`.sp-mc-option[data-qi="${qi}"]`).forEach(sib => sib.classList.remove('selected'));
          el.classList.add('selected');
          updateAnsweredBadge();
        });
      });
      document.querySelectorAll('.sp-bank-chip').forEach(el => {
        el.addEventListener('click', () => {
          el.classList.toggle('selected');
          updateAnsweredBadge();
        });
      });
      updateAnsweredBadge();
    }
  }

  function onAction(e){
    const action = e.currentTarget.dataset.action;
    if(action === 'go-landing'){ state = {screen:'landing'}; hideTimer(); render(); return; }
    if(action === 'select-team-inline'){
      document.querySelectorAll('.sp-team-btn').forEach(sib => sib.classList.remove('selected'));
      e.currentTarget.classList.add('selected');
      return;
    }
    if(action === 'start-game'){
      const selectedBtn = document.querySelector('.sp-team-btn.selected');
      const team = selectedBtn ? selectedBtn.dataset.team : TEAMS[0];
      startPlay(team);
      render();
      return;
    }
    if(action === 'submit-all'){ submitAll(); return; }
    if(action === 'reveal-next'){
      if(state.revealIndex === QUESTIONS.length - 1){
        state.screen = 'summary';
      } else {
        state.revealIndex += 1;
      }
      render();
      return;
    }
    if(action === 'quit-play'){
      if(confirm('Quit this briefing and lose your answers?')) { state = {screen:'landing'}; hideTimer(); render(); }
      return;
    }
  }

  render();
})();
</script>
